[mypy]
python_version = 3.11
files = leaguedirector/settings.py, leaguedirector/enable.py, leaguedirector/api.py
# The UI modules (app.py, widgets.py, sequencer.py, bindings.py) are not yet
# annotated, so imports of them are followed silently rather than checked here.
follow_imports = silent
# PySide6, psutil, etc. do not ship complete/parseable type stubs; don't emit
# noise for them. Local Any-typed shims for the Qt modules live in ./stubs.
mypy_path = stubs
ignore_missing_imports = True
# Enforce that the modules annotated in this pass are fully typed.
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
